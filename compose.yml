services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "3001:3000"  # Exposed for manual testing; not needed for frontend access
    networks:
      - app-network

  frontend:
    build: ./frontend
    environment:
      - API_URL=http://backend:3000
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
