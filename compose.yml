services:
  backend:
    build: ./backend
    environment:
      - PORT=3000
      - SMTP_HOST=${SMTP_HOST:-smtp.example.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_DESTINO=${EMAIL_DESTINO:-}
    ports:
      - "3001:3000"  # Exposed for manual testing; not needed for frontend access
    networks:
      - app-network

  frontend:
    build: ./frontend
    environment:
      - API_URL=http://backend:3000
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
